name: CI & Release

on:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest JSONs
        run: |
          node -e '
            const fs = require("fs");
            JSON.parse(fs.readFileSync("behavior_pack/manifest.json", "utf8"));
            JSON.parse(fs.readFileSync("resource_pack/manifest.json", "utf8"));
            console.log("Behavior & Resource pack manifests are valid JSON.");
          '

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Build bundle
        run: npm run build

      - name: Test package build
        run: npm run pack -- --no-bump

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-qol-addon
          path: dist/**/*.mcaddon
          retention-days: 7

      - name: Notify Discord on failure
        if: failure()
        run: node scripts/discord-notify.js failure
        env:
          DISCORD_DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Notify Discord on commit push
        if: success() && github.event_name == 'push'
        run: node scripts/discord-notify.js commit
        env:
          DISCORD_DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  release:
    name: Publish Release
    environment: release
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build distribution package
        run: npm run pack -- --no-bump

      - name: Determine release metadata
        id: meta
        run: node scripts/release-metadata.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.mcaddon
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          body_path: ${{ steps.meta.outputs.changelog }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord on release
        if: success()
        run: node scripts/discord-notify.js release
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
          CHANGELOG_PATH: ${{ steps.meta.outputs.changelog }}
